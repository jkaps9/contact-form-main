<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | Contact form</title>
  </head>

  <body>
    <main>
      <div class="container">
        <h1>Contact Us</h1>
        <form id="contact-form">
          <div class="success-message">
            <div class="title">
              <img src="assets/images/icon-success-check.svg" alt="" />
              <h2>Message Sent!</h2>
            </div>
            <p>Thanks for completing the form. We'll be in touch soon!</p>
          </div>
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              oninvalid="this.setCustomValidity('This field is required')"
              oninput="this.setCustomValidity('')"
              required
            />
            <div class="error-message">This field is required</div>
          </div>

          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              oninvalid="this.setCustomValidity('This field is required')"
              oninput="this.setCustomValidity('')"
              required
            />
            <div class="error-message">This field is required</div>
          </div>

          <div class="form-group span-all">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              oninvalid="this.setCustomValidity('Please enter a valid email address')"
              oninput="this.setCustomValidity('')"
              required
            />
            <div class="error-message">Please enter a valid email address</div>
          </div>

          <div class="form-group span-all">
            <fieldset class="radio-set" required>
              <legend>Query Type</legend>
              <div class="radio-item">
                <label for="general-enquiry"
                  ><input
                    type="radio"
                    id="general-enquiry"
                    name="query-type"
                    value="general-enquiry"
                  />General Enquiry</label
                >
              </div>
              <div class="radio-item">
                <label for="support-request" class=""
                  ><input
                    type="radio"
                    id="support-request"
                    name="query-type"
                    value="support-request"
                  />Support Request</label
                >
              </div>
              <div class="error-message">Please select a query type</div>
            </fieldset>
          </div>

          <div class="form-group span-all">
            <label for="message">Message</label>
            <textarea
              name="message"
              id="message"
              oninvalid="this.setCustomValidity('This field is required')"
              oninput="this.setCustomValidity('')"
              required
            ></textarea>
            <div class="error-message">This field is required</div>
          </div>

          <div class="form-group span-all consent-row">
            <input type="checkbox" id="consent" name="consent" required />
            <label for="consent" class="consent-label"
              >I consent to being contacted by the team
            </label>
            <div class="error-message span-all">
              To submit this form, please consent to being contacted
            </div>
          </div>

          <button class="span-all">Submit</button>
        </form>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
